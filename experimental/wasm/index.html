<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AV2 OBU Decoder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">WebAssembly experiment</p>
        <h1>AV2 OBU Decoder</h1>
      </div>
      <output id="runtime-status" class="runtime-status">Loading decoder</output>
    </header>

    <section class="workspace" aria-label="OBU decoder">
      <div class="controls">
        <label id="drop-zone" class="drop-zone" for="file-input" tabindex="0">
          <span class="drop-mark" aria-hidden="true">↓</span>
          <strong>Drop an OBU file</strong>
          <span>or choose one from this device</span>
          <input id="file-input" type="file" accept=".obu,application/octet-stream">
        </label>

        <div id="file-details" class="file-details" hidden>
          <div>
            <span>File</span>
            <strong id="file-name"></strong>
          </div>
          <div>
            <span>Input</span>
            <strong id="file-size"></strong>
          </div>
          <div>
            <span>Frame</span>
            <strong id="frame-size">Not decoded</strong>
          </div>
          <div>
            <span>Decode</span>
            <strong id="decode-time">—</strong>
          </div>
        </div>

        <div id="message" class="message" role="status" aria-live="polite">
          The decoder runs locally in your browser.
        </div>

        <button id="download-button" type="button" disabled>
          Download BMP
        </button>
      </div>

      <div class="preview">
        <div id="empty-preview" class="empty-preview">
          <span>Decoded frame</span>
        </div>
        <canvas id="canvas" hidden></canvas>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
